# Logic checks for every change: server unit and integration tests, the
# cross-language protocol check, Android unit tests, and merged coverage.
# Platform builds live in builds.yml.
name: tests

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'book/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'book/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes the running checks pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server-unit:
    name: server unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: server/**/*.csproj
      - name: Test
        run: >
          dotnet test server/DroidOSS.Tests
          --collect:"XPlat Code Coverage"
          --results-directory coverage/unit
          --logger "trx;LogFileName=unit.trx"
          --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit

  server-integration:
    name: server integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: server/**/*.csproj
      # The fake phone in tools/ drives the real server in one of the tests.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test over real UDP sockets
        run: >
          dotnet test server/DroidOSS.IntegrationTests
          --collect:"XPlat Code Coverage"
          --results-directory coverage/integration
          --logger "trx;LogFileName=integration.trx"
          --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-integration
          path: coverage/integration

  protocol:
    name: protocol golden vectors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Python self-test
        run: python tools/fake_phone.py --selftest
      - name: C#, Kotlin and Python agree byte for byte
        run: python tools/check_golden.py

  android-unit:
    name: android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: androidapp3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-report
          path: androidapp3/app/build/reports/tests/

  coverage:
    name: coverage
    needs: [server-unit, server-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Merge unit and integration coverage
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:'coverage/**/coverage.cobertura.xml' \
            -targetdir:coverage/report \
            -reporttypes:'MarkdownSummaryGithub;TextSummary;Html' \
            -assemblyfilters:'+DroidOSS.Core;+DroidOSS.Net'
          cat coverage/report/Summary.txt
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report

  # The one check branch protection needs to require.
  tests:
    name: tests
    if: always()
    needs: [server-unit, server-integration, protocol, android-unit, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
